; Scene Director - cinematic conversation camera
;
; Most keys go live at the next conversation. "(restart)" means a game restart.
; Most are also editable in-game via SKSE Menu Framework.
;
; THIS FILE IS REPLACED BY EVERY UPDATE. Edit it freely - it is the defaults and
; the documentation - but anything you change in the in-game menu is written to
; SD_user.ini beside it instead, which no release ever ships and no update ever
; touches. That file wins over this one, key by key, so a setting you have never
; opened the menu on still comes from here.
;
; This split exists because it did not used to. SD.ini was both the shipped file
; and where the menu saved, so installing an update overwrote every choice - and
; deleted the per-shot weight, FOV and zoom keys outright, since those are the
; only settings that live nowhere else. To move a setting back under this file's
; control, delete its line from SD_user.ini.
;
; Turn OFF: Improved Alternate Conversation Camera, Switch Camera During
; Dialogue, Camera Noise. SmoothCam needs no change.

[Diagnostics]
; bLogSessions and bLogLines were here and nothing has ever read them. Logging
; is not gated by category, so both were dials that did nothing while reading as
; if turning them off would quieten the log. Removed rather than wired up: the
; log is the evidence trail this mod is debugged from and it stays on.

; Hold an opening close-up of the player, in milliseconds. 0 is off.
iOpenShotHold=0

; Install the per-frame tick. 0 patches no camera vtable. (restart)
bFrameSource=1

; Log the facegen morph pass for both faces, once a second. (restart)
; Also what installs the morph hook. Was hand-added to the live ini and missing
; here, which means a deploy silently DELETED it - the merge drops any key the
; shipped file does not carry.
bLogFaceAnim=0

; Pin one viseme slot open on the player's mouth. -1 off, 0-15 a slot. (restart)
; The lipsync discriminator. With 0 the jaw should be visibly stuck open in third
; person, with no conversation and no voice mod involved. If it is, the phoneme
; channel reaches the geometry and the fault is upstream; if it is not, the
; channel never reaches the head and the fault is on the head itself.
iForceViseme=-1

; The same test for the EXPRESSION channel. -1 off, 0-16 pins that expression
; slot wide open on your face every frame - no conversation needed, just look in
; a mirror or third person. If your face is visibly stuck in that expression the
; channel reaches your geometry and this mod can drive it; if it is not, nothing
; will ever render an expression on you and the fault is the head (a head
; replacer without expression morphs, MfgFix being disabled, or another mod
; owning your face).
; 0 Anger  1 Fear  2 Happy  3 Sad  4 Surprise  5 Puzzled  6 Disgust  7 Neutral
iForceExpression=-1

[Direction]
; Direct the camera during conversations. This is the mod.
;
; Live - the checkbox at the top of the Camera page hands the camera back on the
; spot, including mid-conversation. It used to say (restart) here and mean it:
; the value was read once at launch, so turning the mod off meant quitting
; Skyrim and editing this file.
bEnabled=1

; Give first person back at the end, if this mod took it.
bRestoreFirstPerson=1

; Black bars while a conversation is staged.
;
; Live as of 1.4 - the checkbox on the Screen page puts them up and takes them
; down on the spot, including mid-conversation. It used to say (restart) here
; and mean it: the value decided whether the draw hook was installed at all, so
; the bars could not be switched off without quitting Skyrim and editing this
; file, and there was no control for them in the menu.
bLetterbox=1

; bHideInterface and bHideHudWholesale are GONE. Any value left here for either
; is simply not read.
;
; The HUD is now always hidden during a conversation, and hiding it no longer
; costs you anything, which is why it stopped being a question.
;
; What it hides: every element of the HUD, found by walking the HUD movie's own
; display list rather than by matching a list of names written from vanilla.
; The compass, the meters, the crosshair, the activate prompt, the clock, the
; sneak eye and anything your HUD replacer adds beside them.
;
; What it keeps: the notifications. Items picked up, gold, skill increases,
; quest starts and objectives completing all still appear while you talk. So do
; subtitles and the topic list, which live in the dialogue menu and are never
; touched.
;
; bHideHudWholesale existed because the old hide could only take elements it
; already knew the names of, and hiding the whole movie was the only reliable
; alternative — at the price of every notification in the conversation. There is
; no longer a trade to make, so there is no longer a switch.

; --- Camera movement ---------------------------------------------------------
; iRoomSwing, iDollyAmount and iDollyWindow are GONE. Any value left here is
; simply not read.
;
; All three were one number applied to every shot at once - how much of each
; shot's move happens, how long it takes, and how far the room shots may swing
; off the direction the space opens in. Each shot now says for itself what it
; does, how much, and how long, on its own controls in the Shots panel:
;
;   i<Shot>Move        (Effect) 0 None, 1 push in, 2 pull out,
;                      3 crane up, 4 crane down, 5 tilt up, 6 tilt down,
;                      7 drift, 8 zoom in, 9 zoom out,
;                      10 orbit left, 11 orbit right, 12 slide left,
;                      13 slide right
;   i<Shot>MoveAmount  (Amount) 0-100, a percentage of that effect's full travel
;   i<Shot>MoveTime    (Duration) hundredths of a second for it to finish
;
; ORBIT arcs around the subject and keeps pointing at them, so they stay put in
; frame and the room slides behind them. SLIDE moves the camera sideways without
; turning to follow, so the subject drifts across the frame - nothing anchored.
;
; These are written by the in-game menu and are not listed here, the same way
; the per-shot weight and FOV keys are not. A saved i<Shot>Zoom of 1 or 2 from
; before this change is read once and migrated to the matching move.

; --- The topic list ----------------------------------------------------------
; This mod never touches dialogue input. Clicks behave exactly as vanilla.
;
; The list follows the dialogue menu's OWN state, which runs
;   greeting -> topic list -> topic clicked -> transitioning -> topic list
; and it is hidden whenever that state is not "topic list". Nothing below infers
; whose turn it is, times the NPC's reply, counts responses, or watches where the
; camera is pointing - all of that was removed, and it is what the menu resetting,
; flashing, arriving late and showing the answer you just picked all were.
;
; So the dials here shape the FADE ONLY, with one exception: the hold for your
; own voiced line delays the fade's start until that line has finished. None of
; them can change when the options are LIVE; the game decides that and it is
; always right about it.

; Fade your options out while somebody speaks, and back when it is your turn.
; Not before the game has shown you a live list once: the opening greeting is
; always left alone.
bFadeTopicList=1

; Hold your options on screen for as long as your own voiced line is playing,
; and start the delay below when that line ENDS. 1 holds, 0 fades at the click.
;
; Only does anything with a player-voice mod. Without one your line is instant
; and the fade starts at the click either way.
;
; Where the end of your line comes from: Dragonborn ReVoiced announces it, and
; also announces a line you skipped, so on a ReVoiced profile this is exact.
; Under DBVO or vanilla it is read from your character's own sound handles,
; which is the same observation this mod has always used. Either way there is a
; fifteen-second ceiling on the hold, so a signal that never arrives costs you
; one delay rather than a topic list nailed to the screen.
;
; RETIRED: bHideChoicesWhilePlayerSpeaks, which stored the OPPOSITE of what its
; label said - ticking the box that promised to hold was what stopped it
; holding. A value left here for it is not read and is not migrated; inverting
; somebody's setting on their behalf would be wrong for anyone who had already
; worked the old meaning out.
bFadeAfterPlayerLine=1

; Hundredths of a second the spent list is held before it starts fading, once
; your line has finished. 0 fades it the moment you pick, which is the
; CRPG-style behaviour.
iChoiceFadeDelay=150

; Hundredths of a second the spent list takes to fade once it starts going.
; The ease back IN is a separate, gentler 0.55s.
iChoiceFadeTime=200

; Hundredths of a second before the list eases back once the game has rebuilt it.
; Only there to stop it twitching; the game's own rebuild is what brings it back,
; not this.
iListReturnDelay=20

; The opening greeting NEVER hides the list, and there is no setting for it.
;
; bHideChoicesOnGreeting existed for one build and was removed. Accept commits
; the highlighted topic without consulting the cursor and this mod does not gate
; dialogue input, so a hidden list is still a live list - and the click meant to
; start a conversation would pick a topic you never saw. That is the oldest bug
; in this mod and it is not coming back as an option.
;
; The CRPG feel it was asked for comes free now: the game puts its list back
; while the NPC is still finishing the last line, so the options are already
; readable as the line lands. That used to be predicted here from response
; counts and a stopwatch, and predicting it is what showed you the answer you
; had just picked.

; Hide the speaker name vanilla prints beside the list.
;
; Follows the topic-list fade rather than the HUD hide - the name is a SIBLING
; of the list, so fading the options without it leaves it hanging in an
; otherwise empty frame.
bHideSpeakerName=1

; ---------------------------------------------------------------------------
; Direction dials. Times are hundredths of a second, so 240 means 2.40s.
; ---------------------------------------------------------------------------

; bOpenOnSpeaker was here and is GONE. It is how the mod behaves now, always.
;
; Walk up to somebody and they greet you immediately, so the off state held a
; shot of the pair, cut to them, then cut to you - three angles in about two
; seconds, across the start of a line nobody had finished saying. Opening on the
; person talking is not a taste. An opening where NOBODY is speaking still gets
; the two-shot, which is the case it was always right for.

; RETIRED: bCutOnLineEnd, which made a line ENDING a third reason to cut.
;
; A Skyrim exchange has three edges close together and all three used to cut:
; they start talking, they stop talking, you pick a topic and they start again.
; The middle one was always the weak member - nothing has happened except that a
; sentence finished - and on a short line the three landed inside about two
; seconds, which reads as restlessness rather than direction.
;
; The shot a line was framed on is now held through the pause after it, always.
; A value left here is not read.
;
; The camera still moves to whoever has started speaking, and that is not the
; same rule under another name: it fires only when the shot on screen frames the
; wrong person, it always lands on the other one, and it never spends the line
; count below. That is shot and reverse shot, which is what this mod is for.

; --- Per line angle changes --------------------------------------------------
; The first of two independent ways the camera decides to take a new angle.

; Count lines and change angle when enough of them have gone by.
bPerLineAngleChange=1

; How many, counted in lines. The number is re-rolled between the two after
; every change, so the rhythm is not countable. Resets with every reply.
iCutEveryMin=3
iCutEveryMax=6

; Whether a line too short to say anything counts toward the tally above.
; 1 ignores them, so a run of "Yes." and "Hmm." does not walk the camera toward
; its next angle.
bHoldOnShortLines=1

; What counts as short, in words. Read only when above is 1.
iShortLineWords=4

; --- Timed angle changes -----------------------------------------------------
; The second way, and it is genuinely independent of the first. Both off, which
; is how it ships, makes every angle change in the mod a motivated one.

; Whether the timer may fire, per half of the exchange.
bTimedCutsWhileSpeaking=0
bTimedCutsWhileChoosing=0

; How long an angle may sit before either timer above changes it, in hundredths
; of a second. Read only when at least one of them is on.
iMaxShotTime=900

; --- Holds -------------------------------------------------------------------
; Floors under normal angle changes. Subject obstruction recovery can cut sooner.

; How long an angle must hold before a normal cut may change it.
iMinShotTime=240

; The floor when the conversation passes between the two of you, which is the
; one moment an angle is allowed to be cut short. Not a pacing control.
iMinTurnTime=25

; iEstablishTime was here and is GONE, with the shot it timed.
;
; There is no opening shot. The camera is on whoever is talking from the first
; frame of a conversation, and on you when nobody is.

; Always cover your own turn, rather than the room.
bCoverPlayerTurn=1

; Never swing an angle across the eyeline while looking for room. This keeps
; each shot off the line; bTrue180 keeps the whole conversation on one side.
; Off is how the mod behaved before 1.3.3; it is here so a setup tuned against
; that behaviour can get back to it, not because it is a reasonable choice.
bEnforceLine=1

; True 180-degree rule: you are filmed over one shoulder and they are filmed
; over the opposite one, so the camera never crosses the line. Implies
; bEnforceLine.
bTrue180=0

; Prefer shots without somebody standing across the sightline.
;
; The collision probes ignore actors on purpose - a probe cast from a head would
; hit that head - so without this a guard between the camera and the person
; speaking simply does not exist. Costs a short loop over nearby actors per
; angle considered, no physics. Turn off in very crowded cells if you notice it.
; Keep Subject Visible always checks actor obstructions, regardless of this key.
bAvoidCrowds=1

; Require a readable subject and check visibility while the shot plays.
;
; Only objects between the lens and the subject's protected face region count
; as obstructions. Foreground objects beside the face, or covering only the
; lower torso, may remain in the shot. Lens collision is checked separately.
; Chooses among clear enabled shots using the existing shot preferences.
; Always includes actor checks, even with bAvoidCrowds=0.
;
; Off by default so existing camera preferences keep their behavior. Turning it
; on in the menu turns bHoldPlacement off. If both are 1 in the INI, the saved
; bHoldPlacement preference wins and subject protection stays off.
; Detection uses collision geometry and actor approximations; collisionless
; decorations and exact rendered transparency are not detected reliably.
bKeepSubjectVisible=0

; With Keep Subject Visible on, use first person if no clear enabled shot can
; be found. The conversation continues; cinematic coverage returns only after
; clearance is sustained. The player's own first-person view may also be blocked.
; Off can hold the current enabled shot even if obstructed. If that shot is
; disabled or has no valid pose, the normal game camera takes over.
bFirstPersonFallback=1

; Stop checking for obstructions once the angle has been chosen.
;
; Off, the camera keeps measuring the room every frame it is on screen. That is
; what lets it back away from geometry the conversation walks into, and it is
; also why a cart crossing behind the lens, or somebody walking in front of it,
; eases the camera in and then back out. The move is small and nobody asked for
; it; in a market or on a street it never stops.
;
; On, every check still runs when the angle is chosen - the camera is placed
; clear of walls, out of collision, with a line to whoever it is framing - and
; then the shot holds. Things pass through frame and the camera does not move.
;
; What you give up is the correction afterwards. If the two of you walk while
; talking, the camera follows at the distance and bearing it settled on, through
; whatever is in the way. Best in crowds, worst in a conversation that moves.
;
; Cheaper than off, for what it is worth: a held angle casts no rays at all.
; Mutually exclusive with Keep Subject Visible. Enabling this in the menu turns
; that option off; this key takes priority if both are enabled in the INI.
bHoldPlacement=0

; ---------------------------------------------------------------------------
; Keys, while a conversation is on screen. DirectX scan codes; 0 is unassigned.
;
; Both ship unassigned. Guessing a binding inside somebody else's load order is
; worse than asking for one - set them on the Keys page in the settings menu,
; which captures whatever you press rather than making you look a code up.
;
; iKeyRelease was here and is GONE. Turning the mod off is bEnabled above, which
; is a live setting now: the menu checkbox hands the camera back on the spot,
; mid-conversation, and unlike the key it is still off next time.

; Change the angle now, without waiting.
iKeyNextAngle=0

; Switch who the camera looks at. First press goes to whoever is NOT on screen;
; press again to keep cycling. Hands back to automatic at the end of the turn.
iKeyFraming=0

; Bar height, thousandths of screen height each. 120 is 12% of the frame per
; bar; the menu draws it as a percentage.
iLetterboxHeight=120

; Hundredths of a second held on you before cutting to the reply.
; Delete this line to let it choose for itself.
; iPlayerBeat=45

; Voiced player lines: hundredths of a second to stay on you after your line
; ends before cutting to them. 0 cuts immediately. 0-300.
iPlayerVoiceHold=0

; Reaction shots: after every iReactionEvery of their lines (1-10) in a reply,
; an iReactionChance percent (0-100) chance that their next line is shown on
; you. Skips short and full-intensity lines; automatic framing only. Counts
; reset with every reply.
bReactionShots=0
iReactionEvery=3
iReactionChance=50

; ---------------------------------------------------------------------------
[Shots]
; Which setups the picker may draw, and how each one behaves.
;
; Ten keys per setup, and only the first is listed below - the rest are
; written when you change them in the menu, under Shots, where each setup is one
; expandable row, or when you tick a preset:
;
; The menu name for each is in brackets. Key names are a shipped contract and
; never change; what the panel calls them may be reworded.
;
;   b<Name>            1 on, 0 off
;   i<Name>Weight      (Frequency) 0-100, how often it is drawn against the
;                      others in its group. Twice the number is twice as often,
;                      and 0 means never - by any route, including the
;                      fallbacks. Staples ship at 100 and accents at 50; the
;                      editor's Default button puts a setup back to its own.
;   i<Name>Fov         (FOV) field of view in degrees, 20-150.
;   i<Name>Move        (Effect) what it does while on screen. 0 is None, then
;                      push in, pull out, crane up/down, tilt up/down, drift,
;                      zoom in/out, orbit left/right, slide left/right.
;   i<Name>MoveAmount  (Amount) 0-100, how much of that effect happens. Means
;                      the same for every effect, so switching one keeps its
;                      intensity. With Effect at None this is 0 and is not read.
;   i<Name>MoveTime    (Duration) how long the effect takes, in hundredths of a
;                      second. With Effect at None this is 400 and is not read;
;                      both are pinned so that two angles showing None are the
;                      same angle as far as preset comparison is concerned.
;   s<Name>Light       which lighting look this angle uses, BY NAME: off,
;                      natural, soft, hard or edge. See [Lighting]. A name that
;                      does not match anything falls back to what the angle
;                      ships under, and says so in the log.
;   i<Name>LightX      this angle's own light nudge, added to the global one.
;   i<Name>LightY      Same axes as [Lighting] iOffsetX/Y/Z: across the frame,
;   i<Name>LightZ      toward or past the subject, and down or up. -400 to 400.
;
; THE FOUR LIGHT KEYS ONLY DO ANYTHING WITH [Lighting] bPerShot=1. Off - which
; is how it ships - every angle uses the one look and the one nudge set in
; [Lighting], and these are read but never used. There is no Light page in 1.4;
; set bPerShot by hand and the shot editor grows a Light section.
;
; THE LOOK KEY IS THE ONE THAT IS NOT A NUMBER, hence the s. An ordinal would
; point at whatever later occupied that slot in the look list, so adding a look
; would silently relight every angle below it.
;
; RETIRED: i<Name>Zoom, which was 0 none, 1 zoom in, 2 zoom out. It is read once
; to carry a pre-1.3 choice over to i<Name>Move and does nothing after that.
; Delete it; a value left here will not be honoured.
;
; A PRESET WRITES ALL TEN, for every setup it uses. That is what makes the three
; looks different from each other rather than three subsets of one look - the
; same angle at 40 degrees and at 95 is two different images, and how often each
; one is drawn is what decides whether a look is mostly faces or mostly room.
; Everything a preset writes stays editable afterwards.
;
; The weight used to be multiplied by how many times a setup was listed in the
; picker's pools, which was invisible - a staple set to 34 beat an accent set to
; 50. The pools now list everything once and that baseline is the DEFAULT weight
; instead, so the number here is the number that competes. Sliders left alone
; behave exactly as before.
;
; Whoever is speaking always gets the camera, whatever is off here.
; ---------------------------------------------------------------------------

; WHAT SHIPS ON, AND WHY IT IS SIX RATHER THAN THIRTY-NINE.
;
; These flags are the CLOSE preset, angle for angle. A clean install comes up
; reading Close on the Presets page, and it can only do that if the shipped
; settings are exactly what Close writes - so this list, the C++ defaults and
; the preset itself are three statements of one set of angles.
;
; Everything below is still here and still yours. Tick any of them on the Shots
; page, or apply Standard or Room from Presets, and this file's opinion stops
; mattering: your choices are written to SD_user.ini, which no update touches.
;
; The other nine keys each angle owns - frequency, FOV, effect, amount,
; duration, light and the three light nudges - are deliberately NOT listed. They
; are written by the menu and by presets, and where they are absent each angle
; falls back to what Close asks of it, which is the same thing this list says.

; --- NPC: them, while they speak -------------------------------------------

; Over Your Shoulder, at four heights. The plain one is in Close; the wide one
; needs room.
bOverPlayerShoulder=1
bOverPlayerShoulderLow=0
bOverPlayerShoulderHigh=0
bOverPlayerShoulderWide=0

; The tight over-the-shoulder, and Three Quarters.
bDirtyNpc=0
bThreeQuarterNpc=0

; The close range. Extreme Close Up is reserved for full-intensity lines.
bCloseUp=1
bExtremeClose=1
bCloseLow=0
bCloseHigh=0
bCloseProfile=0
bCloseWide=0

; Head And Shoulders, and looser.
bMediumNpc=0
bMediumProfile=0
bLowAngle=0
bLowProfile=0

; Wide. Both need room.
bLongNpc=0
bOverhead=0

; --- PC: you, while you choose ---------------------------------------------

; Over Their Shoulder at you, matching the four heights above.
bOverNpcShoulder=0
bOverNpcShoulderLow=0
bOverNpcShoulderHigh=0
bOverNpcShoulderWide=0

; The rest of your side, at matching sizes.
bDirtyPlayer=0
bThreeQuarterPlayer=0
bClosePlayer=1
bExtremeClosePlayer=1
bMediumPlayer=0
bPlayerProfile=0
bPlayerLow=0
bHighAngle=0
bLongPlayer=0
bPlayerOverhead=0

; --- Room: the space around you --------------------------------------------
; What turns a long pause into a look around the space.

; Both of you in frame. The low, high and wide variants were removed.
bTwoShot=0

bProfile=0
bWide=0

; The whole space from up and back, and from near the floor.
bMaster=0
bGroundLevel=0

; Across the room on a long lens. The one wide angle Close keeps, drawn about
; one line in twenty-six, so the eye has somewhere to land.
bDistant=1
bDistantLow=0

; bTwoShotLow/High/Wide, bAnchored and bAnchoredHigh were removed and do nothing.

[Performance]
; Clause-based player acting: conversational action and emotional tone are separate.
; Inquiry, confirmation, skepticism and statements use distinct upper-face poses.
; Explicit English cues supply player tone; authored NPC emotions stay authoritative.
; Clause timing estimates word distribution within the voice window, not word sync.
; No voice-tone analysis. Neutral NPC lines do not inherit old listener emotion.
; Live under Faces. Each expression profile owns its complete upper-face pose.
; There is no standalone brow/speech layer. Mouth lip sync stays independent.
; Profile overrides use [Expression.Inquiry], [Expression.Happy], etc. in SD_user.ini.
; Keys: iBrowLiftLeft/Right (-100..100; negative lowers, positive raises),
; iBrowInLeft/Right and iSquintLeft/Right (0..100), iRegionEmotion (0..7),
; iRegionStrength (0..100). Missing values use built-in coordinated defaults.
; Lift is a signed axis, including transitions: no opposing raise/lower mixture.
; Neutral statements default to no added pose. Explicit emotion selects its own
; complete profile instead of stacking a second brow recipe over the question.
bExpressions=1
; Expression strength is fixed internally at 1.50 with a soft actuator ceiling.
; The old iExpressionStrength key and menu slider are retired and ignored.
; Fuller native expressions while silently listening, with speech priority.
; Set to 0 for an upper-face-only comparison; no player reaction camera cuts.
bCinematicListening=1
; Additional eye/upper-cheek morphs, currently for the verified HPH female head.
; Requires the matching local .sduf asset. Other heads retain brow/squint motion.
bRegionalExpressions=1

; Gaze and forced head-draw controls remain retired. Old bGaze, iListenerGaze,
; iSpeakerGaze and bHoldPlayerFace keys are ignored.

; LIP SYNC FALLBACK. Move the player's mouth while a player-voice mod speaks
; their line. Both of these are in the in-game menu under Faces and apply as you
; drag them.
;
; Measured: SpeakSound plays the audio but the .lip track inside the .fuz is
; never applied, so nothing writes a viseme track and the mouth stays shut. This
; supplies one. Only ever writes while YOUR voice line is actually playing, so
; it is inert without a voice mod like DBVO or DBReV.
;
; ON BY DEFAULT for DBVO 1 and DBVO 2. Dragonborn ReVoiced drives your mouth
; itself and does it better - it knows the file, the length and when a line was
; cut short - so ReVoiced users should switch this off to avoid two mods writing
; the same visemes at each other.
bSynthLipSync=1

; Overall mouth movement, as a percentage. This is a JAW dial — the lips keep
; more of their movement as it comes down, because they are what makes a mouth
; look like it is saying words. 55 is about conversational; high reads as
; shouting.
iLipSyncStrength=55

; Legacy bBrowSync and iBrowStrength are retired and ignored. Brow movement is
; authored in Expression.* profiles and follows bExpressions with fixed tuning.

; Point both participants at each other during a conversation.
;
; This is the engine's own head tracking, aimed - not a gaze model of this mod's
; own. Set to 0 first if your character's animation misbehaves.
bHeadtracking=1

; ---------------------------------------------------------------------------
[Lighting]
; ---------------------------------------------------------------------------
; Put a light on whoever the shot is on, so faces stop looking flat.
;
; THERE IS NO LIGHT PAGE IN 1.4. The whole section below is experimental and is
; reachable only from this file - the menu entry it used to have is gone.
;
; It is dormant rather than deleted. Everything here still works, still ships
; off, and can still be switched on by hand; what it stopped doing is asking a
; question. The page opened by wanting to know which lighting rig you would
; like, and the honest answer to that is "I do not know, I wanted the faces to
; look better". No preset switches it on, either.
;
; Nothing here loads a form, writes to your save, or replaces a shader. The
; lights are created when a conversation opens and taken down when it closes.
;
; OFF BY DEFAULT, and deliberately: this is the only thing in the mod that
; changes how the game LOOKS rather than how it is shot, and a lighting overhaul
; you already like has a claim on that.
;
; NOT bEnabled, and that is not a style choice. [Direction] already has one, and
; every key name in this file is unique across the whole of it - which is not a
; convention, it is load-bearing: tools\Deploy.ps1 merges your settings back over
; a new release by key name, so two sections sharing one name means the deploy
; carries the wrong value into one of them. It did exactly that once, silently
; turning this on because [Direction] bEnabled was 1.
bLights=0

; How bright, as a percentage.
iBrightness=100

; What colour, 0-255 per channel. In the menu this is a colour picker - click the
; swatch for a hue wheel and a hex box.
;
; THIS IS THE COLOUR, NOT THE AMOUNT. How much light there is comes from
; iBrightness above. Pushing all three channels to 255 gives you white, not a
; brighter light.
;
; The default is a warm white, which is what most Skyrim interiors are lit by.
; Some starting points:
;
;   255 246 234   warm white - candles, hearths, most interiors (default)
;   255 255 255   neutral white
;   214 228 255   moonlight - exteriors at night, ice caves
;   255 214 158   firelight - strong amber, close to a torch
;   198 255 214   wisp green - Falmer halls, anything sickly
;   224 208 255   arcane - mage colleges, soul gems
iRed=255
iGreen=246
iBlue=234

; Which look. One of:
;
;   off       no added light at all
;   natural   a gentle lift on the face; safe anywhere, hard to notice
;   soft      broad and forgiving; low contrast, flattering
;   hard      one strong side light, nothing filling the shadow
;   edge      no key at all; shape from behind, face left in shadow
;
; They differ by SHAPE and nothing else - there is no warm look and no cold one,
; because that is what iWarmth is for.
sLook=natural

; --- Moving the light --------------------------------------------------------
; World units, and MEASURED FROM THE SHOT rather than from the world.
;
;   iOffsetX   left and right across the frame
;   iOffsetY   toward the camera (negative) or past the subject (positive)
;   iOffsetZ   down and up
;
; World axes would have been easier and would have been useless: a light pinned
; to world X swings around the subject as a conversation turns, so a setting
; that looked right in one doorway is lighting the back of somebody's head in
; the next. These stay put through a cut, a reverse, and a conversation that
; walks across a room.
;
; -400 to 400 each. 0 is wherever the look puts it.
iOffsetX=0
iOffsetY=0
iOffsetZ=0

; Give every angle its own look and its own nudge, set per angle in the menu
; under Shots. Off, they all share the settings above.
;
; The four per-angle keys are s<Name>Light, i<Name>LightX, i<Name>LightY and
; i<Name>LightZ - see [Shots]. They are read whether or not this is on, so
; switching it on takes effect on the next conversation rather than the one
; after; they simply are not used while it is off.
bPerShot=0

; --- Two you probably want to leave alone ------------------------------------
; Deliberately not in the menu. Neither is a question worth putting to somebody
; who just wants the light on.

; Every light throws real shadows. The most expensive setting in this mod by a
; wide margin, and the difference is one most people would not name.
bShadows=0

; How long the light takes to change when the angle does, in hundredths of a
; second. A cut changes the angle and the light on the same frame, and two large
; simultaneous changes read as a rendering fault rather than as an edit. 0 snaps.
iFadeTime=18

; --- Depth of field ----------------------------------------------------------
; Borrowed rather than shipped. Engine DoF needs a TESImageSpaceModifier form,
; which normally means bundling an ESL - except Skyrim.esm already contains one
; built for the purpose, VATSImodDOF, a leftover of a feature Skyrim never
; shipped. It is in every install by definition, so it can simply be borrowed.
;
; Independent of the light above and useful without it. The light separates a
; subject by lighting them; this separates them by blurring what is behind.
bDepthOfField=0

; How much blur, as a percentage.
iBlur=55

; RETIRED: iWarmth, which was one dial running 0 cold to 100 warm through a
; hand-written tungsten curve. It was the right NUMBER of controls and the wrong
; control: a curve only offers the colours somebody thought to put on it, so
; amber and pale blue were reachable and every hue was not. Replaced by the three
; channels above, which is the same one widget in the menu and strictly more.
;
; RETIRED: iMasterScale, bEmotionShifts, and every key that began with a look
; name - iSoftKeyIntensity, iHardRimRadius and the two hundred or so others -
; along with the whole of [LightRigs] and [LightEmotion].
;
; That version let you place three lamps per look across ten looks, and set what
; each of the eight authored emotions did to whichever one was running. All of
; it worked and none of it was usable: the first thing it asked was which of ten
; lighting rigs you wanted, and the honest answer to that is "I do not know, I
; wanted the faces to look better". Delete any of them you find; none are read.

; ---------------------------------------------------------------------------
[Presets]
; ---------------------------------------------------------------------------
; Apply a named way of shooting, once, on the next game start.
; For load orders with no SKSE Menu Framework. The key clears itself.
;
; The names below are the ini tokens and never change. What the menu calls each
; one is in brackets - those are display names and may be reworded.
;
;   standard   (Standard)  Over the shoulder, then close on whoever is talking.
;   close      (Close)     Tight on faces, and never far from one. THE DEFAULT -
;                          everything this file ships is what Close writes, so a
;                          clean install already reads as Close and asking for it
;                          here would be asking for what you have.
;   room       (Room)      Where you are, more than who is talking.
;
; No preset touches the lighting feature, the letterbox, or whether your own
; turn is covered. Everything a preset does set stays editable afterwards.
sApply=

[CustomPresets]
; ---------------------------------------------------------------------------
; Three slots for your OWN settings, filled from the Presets page in-game.
;
; Not the same thing as the three above. Those are designed looks - a chosen set
; of angles with a movement given to each one for a reason. A slot is a snapshot
; of whatever you had set up when you pressed save.
;
; sSlotNName is the name you gave it and is safe to edit. sSlotN is the snapshot
; itself: eight timing dials, then four numbers for every angle in the mod. It
; is written by the menu and is not meant to be edited by hand - to change what
; a slot holds, set the camera up how you want it and save over the slot.
;
; Clearing both lines of a slot empties it. Snapshots carry a version, and one
; written by a build with a different set of angles is refused rather than
; applied wrongly.
sSlot1Name=
sSlot1=
sSlot2Name=
sSlot2=
sSlot3Name=
sSlot3=
